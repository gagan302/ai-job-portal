server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ai/ { proxy_pass http://ai-service:5001; proxy_set_header Host $host; proxy_read_timeout 90s; }
  location /api/    { proxy_pass http://api-service:5000; proxy_set_header Host $host; }
  location /        { try_files $uri /index.html; }
}
