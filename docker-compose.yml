services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes: [mongo_data:/data/db]

  api-service:
    build: ./api-service
    restart: unless-stopped
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/jobportal
      JWT_SECRET: ${JWT_SECRET}
    depends_on: [mongo]

  ai-service:
    build: ./ai-service
    restart: unless-stopped
    environment:
      PORT: 5001
      JWT_SECRET: ${JWT_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      API_SERVICE_URL: http://api-service:5000
    depends_on: [api-service]

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports: ["80:80"]
    depends_on: [api-service, ai-service]

volumes:
  mongo_data:
